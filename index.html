<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="disabled-adaptations" content="watch">
<title>Ascend</title>
<style>
  :root {
    --bg: #000; --fg: #fff; --muted: #8e8e93; --btn: #1c1c1e; --btn2: #2c2c2e;
    --bull: #ffd60a; --close: #30d158; --warm: #ff9f0a; --cold: #64d2ff; --miss: #636366;
  }
  html { font-size: calc(min(100vw, 100vh) / 17); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: -apple-system, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #app { position: absolute; inset: 0; display: flex; }
  /* altitude track on the left edge */
  #track { width: 1.3rem; position: relative; flex: none; }
  #track .line { position: absolute; left: 50%; top: 2rem; bottom: 2rem; width: 2px; margin-left: -1px;
    background: linear-gradient(#64d2ff, #1c1c1e); border-radius: 1px; }
  #plane { position: absolute; left: 0; width: 1.3rem; text-align: center; font-size: 0.95rem;
    transition: bottom .9s cubic-bezier(.2,.8,.2,1); transform: translateY(50%) rotate(-45deg); }
  /* generous insets: the watch screen has big rounded corners */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 0.55rem 0.7rem 0.75rem 0.15rem; box-sizing: border-box; }
  #main .row { padding: 0 0.6rem 0 0.4rem; }
  .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.85rem; color: var(--muted); }
  .alt { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .timer { height: 3px; background: var(--btn2); border-radius: 2px; margin: 0.25rem 0 0.35rem; overflow: hidden; }
  .timer i { display: block; height: 100%; background: var(--close); width: 100%; }
  .prompt { font-size: 1.05rem; font-weight: 600; line-height: 1.2; margin-bottom: 0.4rem; }
  .prompt b { color: var(--bull); white-space: nowrap; }
  .opts { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; min-height: 0; justify-content: center; }
  button { font: inherit; color: inherit; border: 0; background: var(--btn); border-radius: 0.6rem;
    padding: 0 0.55rem; text-align: left; flex: 1; min-height: 1.9rem; max-height: 2.6rem;
    font-size: 0.95rem; display: flex; align-items: center; justify-content: space-between; gap: 0.3rem; }
  button:active { background: var(--btn2); }
  button .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mark { position: absolute; left: 0; width: 1.3rem; text-align: center; font-size: 0.6rem; transform: translateY(50%); opacity: .55; }
  button .v { color: var(--muted); font-size: 0.8rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  button.best { box-shadow: inset 0 0 0 2px var(--close); }
  button.picked { background: var(--btn2); }
  button.picked .n::before { content: '› '; color: var(--bull); }
  .big { flex: none; justify-content: center; text-align: center; background: #0a84ff; font-weight: 600; min-height: 2.2rem; }
  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 0.25rem; }
  .title { font-size: 2rem; font-weight: 700; letter-spacing: 0.05em; }
  .sub { color: var(--muted); font-size: 0.85rem; }
  .tier { font-size: 1.2rem; font-weight: 700; }
  .pts { font-size: 0.95rem; }
  .gold { color: var(--bull); font-size: 0.8rem; font-weight: 600; }
  .dots { display: flex; gap: 0.2rem; justify-content: center; margin: 0.2rem 0; }
  .dots span { width: 0.7rem; height: 0.7rem; border-radius: 0.2rem; }
  .fact { font-size: 0.8rem; color: var(--muted); margin: 0.1rem 0 0.3rem; }
</style>
</head>

      ['Forrest Gump', 142], ['Shawshank Redemption', 142], ['Mary Poppins', 139], ['Fight Club', 139],
      ['Everything Everywhere', 139], ['Terminator 2', 137], ['The Matrix', 136], ['Black Panther', 134],
      ['Parasite', 132], ['Top Gun: Maverick', 131], ['La La Land', 128], ['Jurassic Park', 127], ['Iron Man', 126],
      ['Fantasia', 126], ['Spirited Away', 125], ['Jaws', 124], ['Joker', 122], ['Star Wars (1977)', 121],
      ['Spider-Man (2002)', 121], ['Mad Max: Fury Road', 120], ['The Social Network', 120], ['The Lion King (2019)', 118],
      ['Silence of the Lambs', 118], ['Cars', 117], ['Alien', 117], ['Back to the Future', 116], ['E.T.', 115],
      ['The Incredibles', 115], ['Barbie', 114], ['Ratatouille', 111], ['Zootopia', 108], ['Deadpool', 108],
      ['Moana', 107], ['Coco', 105], ['Ghostbusters', 105], ['Jumanji (1995)', 104], ['Home Alone', 103],
      ['Frozen II', 103], ['Toy Story 3', 103], ['The Truman Show', 103], ['Frozen', 102], ['Encanto', 102],
      ['A Minecraft Movie', 101], ['John Wick', 101], ['Groundhog Day', 101], ['Finding Nemo', 100], ['Tangled', 100],
      ['WALL-E', 98], ['Mean Girls', 97], ['Up', 96], ['Inside Out 2', 96], ['Inside Out', 95], ['Paddington', 95],
      ['Despicable Me', 95], ['Shrek 2', 93], ['Monsters, Inc.', 92], ['Kung Fu Panda', 92],
      ['Super Mario Bros. Movie', 92], ['Minions', 91], ['Gravity', 91], ['Shrek', 90], ['Aladdin (1992)', 90],
      ['The Lion King (1994)', 88], ['My Neighbor Totoro', 86], ['Madagascar', 86], ['Beauty and the Beast (1991)', 84],
      ['Snow White (1937)', 83], ['Toy Story', 81], ['Bambi', 70], ['Dumbo', 64]] },
  };
  const YEARS = [
    // tech & internet
    ['First iPhone went on sale', 2007], ['First iPad released', 2010], ['Apple Watch released', 2015],
    ['First Macintosh', 1984], ['Windows 95 released', 1995], ['Nokia 3310 released', 2000], ['First Android phone', 2008],
    ['iPod launched', 2001], ['Apple was founded', 1976], ['Microsoft was founded', 1975], ['Google was founded', 1998],
    ['Amazon was founded', 1994], ['Netflix was founded', 1997], ['Tesla was founded', 2003], ['SpaceX was founded', 2002],
    ['Facebook launched', 2004], ['YouTube launched', 2005], ['Twitter launched', 2006], ['Instagram launched', 2010],
    ['Snapchat launched', 2011], ['WhatsApp was founded', 2009], ['Discord launched', 2015], ['Twitch launched', 2011],
    ['Wikipedia launched', 2001], ['Spotify launched', 2008], ['Bitcoin was created', 2009], ['ChatGPT was released', 2022],
    ['First website went online', 1991], ['First email was sent', 1971], ['First ARPANET message', 1969],

    ['Half-Life released', 1998], ['The Sims released', 2000], ['First Halo game', 2001], ['First Call of Duty', 2003],
    ['Steam launched', 2003], ['World of Warcraft released', 2004], ['Roblox launched', 2006], ['Angry Birds released', 2009],
    ['League of Legends released', 2009], ['Minecraft full release', 2011], ['CS:GO released', 2012],
    ['Clash of Clans released', 2012], ['Candy Crush released', 2012], ['GTA V released', 2013],
    ['Pokémon GO released', 2016], ['Overwatch released', 2016], ['Fortnite launched', 2017], ['Among Us released', 2018],
    ['Valorant released', 2020], ['First Pokémon games (Japan)', 1996],
    // film, music, books
    ['Snow White (Disney) released', 1937], ['The Wizard of Oz released', 1939], ['Mickey Mouse first appeared', 1928],
    ['Disneyland opened', 1955], ['Jaws released', 1975], ['First Star Wars film', 1977], ['E.T. released', 1982],
    ['Back to the Future released', 1985], ['Jurassic Park released', 1993], ['The Lion King released', 1994],
    ['Toy Story released', 1995], ['Titanic (film) released', 1997], ['The Matrix released', 1999],
    ['Shrek released', 2001], ['First LOTR film', 2001], ['Spider-Man (Raimi) released', 2002],
    ['Finding Nemo released', 2003], ['Iron Man (first MCU film)', 2008], ['Avatar released', 2009],
    ['Frozen released', 2013], ['Avengers: Endgame released', 2019], ['Barbie movie released', 2023],
    ['First Oscars ceremony', 1929], ['First Eurovision', 1956], ['ABBA won Eurovision', 1974], ['MTV launched', 1981],
    ["Beatles' first album", 1963], ['The Beatles broke up', 1970], ['Bohemian Rhapsody released', 1975],
    ['Elvis Presley died', 1977], ['Thriller album released', 1982], ['Live Aid concert', 1985],
    ['Freddie Mercury died', 1991], ['Michael Jackson died', 2009], ["Taylor Swift's debut album", 2006],
    ['Gangnam Style released', 2012], ['Despacito released', 2017], ['First Harry Potter book', 1997],
    ['The Hobbit published', 1937], ['Lord of the Rings published', 1954], ["Orwell's 1984 published", 1949],
    ['Pan Tadeusz published', 1834], ['Quo Vadis published', 1896],
    // history & Poland
    ['Western Roman Empire fell', 476], ['Charlemagne crowned emperor', 800], ['Baptism of Poland', 966],
    ['Battle of Hastings', 1066], ['First Crusade began', 1096], ['Magna Carta signed', 1215],
    ['Black Death reached Europe', 1347], ['Battle of Grunwald', 1410], ['Fall of Constantinople', 1453],
    ['Leonardo da Vinci was born', 1452], ['Columbus reached the Americas', 1492], ['Vasco da Gama reached India', 1498],
    ['Sistine Chapel ceiling finished', 1512], ["Luther's 95 Theses", 1517], ["Magellan's voyage completed", 1522],
    ["Copernicus' book published", 1543], ['Shakespeare was born', 1564], ['Mayflower reached America', 1620],
    ['Great Fire of London', 1666], ['Mozart was born', 1756], ['Cook reached Australia', 1770],
    ['US Declaration of Independence', 1776], ['French Revolution began', 1789], ["Poland's 3 May Constitution", 1791],
    ['Napoleon crowned emperor', 1804], ['Chopin was born', 1810], ['Battle of Waterloo', 1815],
    ["Beethoven's 9th premiered", 1824], ["Darwin's Origin of Species", 1859], ['American Civil War ended', 1865],
    ['Suez Canal opened', 1869], ['Germany unified', 1871], ['Telephone was patented', 1876], ['First Wimbledon', 1877],
    ["Edison's light bulb", 1879], ['Statue of Liberty unveiled', 1886], ['Coca-Cola was invented', 1886],
    ['Eiffel Tower completed', 1889], ['First modern Olympics', 1896], ['First Nobel Prizes', 1901],
    ["Marie Curie's first Nobel", 1903], ["Wright brothers' first flight", 1903], ['First Tour de France', 1903],
    ["Einstein's special relativity", 1905], ['Sienkiewicz won the Nobel', 1905], ['The Titanic sank', 1912],
    ['World War I began', 1914], ['Panama Canal opened', 1914], ['World War I ended', 1918],
    ['Poland regained independence', 1918], ['Treaty of Versailles', 1919], ['Penicillin was discovered', 1928],
    ['Wall Street Crash', 1929], ['First FIFA World Cup', 1930], ['Empire State Building opened', 1931],
    ['Golden Gate Bridge opened', 1937], ['Hindenburg disaster', 1937], ['World War II began', 1939],
    ['Warsaw Ghetto Uprising', 1943], ['Warsaw Uprising', 1944], ['World War II ended', 1945], ['United Nations founded', 1945],
    ['NATO was founded', 1949], ['Korean War began', 1950], ['Everest first climbed', 1953],
    ['Elizabeth II was crowned', 1953], ['DNA double helix discovered', 1953], ['Polio vaccine announced', 1955],
    ['Sputnik launched', 1957], ['LEGO brick patented', 1958], ['Barbie doll launched', 1959], ['First Paralympics', 1960],
    ['First Euro football championship', 1960], ['Gagarin flew to space', 1961], ['Berlin Wall was built', 1961],
    ['Cuban Missile Crisis', 1962], ['"I Have a Dream" speech', 1963], ['JFK was assassinated', 1963],
    ['First heart transplant', 1967], ['First Super Bowl', 1967], ['First Moon landing', 1969], ['Woodstock festival', 1969],
    ['Apollo 13 mission', 1970], ['Nixon resigned', 1974], ["Rubik's Cube invented", 1974], ['Voyager 1 launched', 1977],
    ['John Paul II became pope', 1978], ['Solidarity was founded', 1980], ['Martial law in Poland', 1981],
    ['First Space Shuttle flight', 1981], ['Challenger disaster', 1986], ['Chernobyl disaster', 1986],
    ["Maradona's 'Hand of God'", 1986], ['The Berlin Wall fell', 1989], ['Partly free elections in Poland', 1989],
    ['Hubble telescope launched', 1990], ['Mandela freed from prison', 1990], ['Germany reunified', 1990],
    ['Soviet Union dissolved', 1991], ['Champions League began', 1992], ['Channel Tunnel opened', 1994],
    ['Dolly the sheep cloned', 1996], ['Mars Pathfinder landed', 1997], ['Poland joined NATO', 1999],
    ['First ISS crew arrived', 2000], ['9/11 attacks', 2001], ['Euro coins & notes arrived', 2002],
    ['Human genome completed', 2003], ['Poland joined the EU', 2004], ['Messi debuted for Barcelona', 2004],
    ['Indian Ocean tsunami', 2004], ['Hurricane Katrina', 2005], ['Pluto stopped being a planet', 2006],
    ['Poland joined Schengen', 2007], ['Phelps won 8 golds', 2008], ['Bolt ran 9.58 s', 2009],
    ['Ronaldo joined Real Madrid', 2009], ['Burj Khalifa opened', 2010], ['Smolensk air crash', 2010],
    ['Fukushima disaster', 2011], ['Last Space Shuttle flight', 2011], ['Curiosity landed on Mars', 2012],
    ['Higgs boson discovered', 2012], ['Euro 2012 in Poland & Ukraine', 2012], ['Rosetta landed on a comet', 2014],
    ['Gravitational waves detected', 2015], ['Lewandowski: 5 goals in 9 min', 2015], ['Brexit referendum', 2016],
    ['First black hole photo', 2019], ['Notre-Dame fire', 2019], ['COVID-19 pandemic declared', 2020],
    ['First SpaceX crewed flight', 2020], ["Świątek's first French Open", 2020], ['James Webb telescope launched', 2021],
    ['Argentina won World Cup (Messi)', 2022], ['Elizabeth II died', 2022], ['Lewandowski joined Barcelona', 2022],
  ];
  const TIERS = { bull: ['Bullseye', 'var(--bull)'], close: ['Close', 'var(--close)'], warm: ['Warm', 'var(--warm)'],
    cold: ['Cold', 'var(--cold)'], miss: ['Miss', 'var(--miss)'], time: ["Time's up", 'var(--miss)'] };
  const ROUNDS = 7, TIME = 20, M_PER_PT = 12, MAX_ALT = 9600;   // perfect day = 800 pts = 9,600 m (above Everest)
  const THIS_YEAR = new Date().getFullYear();
  const MAX_OFF = 0.12;   // the best option is always within ~12% of the target (±3 years for year rounds)

  // ---------- helpers ----------
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
  function shuffle(a, r) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const today = () => ymd(new Date());
  const num = (v, dp) => (+v.toFixed(dp)).toLocaleString('en-US');
  function fmt(v, unit) {
    if (unit === '#') return String(Math.round(v));
    if (unit === 'M') return v >= 1000 ? num(v / 1000, 2) + ' bn' : v < 1 ? num(v * 1000, 0) + 'k' : num(v, v < 20 ? 1 : 0) + ' M';
    if (unit === 'kg') return v >= 10000 ? num(v / 1000, 0) + ' t' : v < 1 ? num(v * 1000, 0) + ' g' : num(v, v < 10 ? 1 : 0) + ' kg';
    if (unit === 'km²') return v >= 1e6 ? num(v / 1e6, 2) + 'M km²' : v >= 1e4 ? num(v / 1000, 0) + 'k km²' : num(v, v < 10 ? 1 : 0) + ' km²';
    if (unit === 'km' && v >= 1e6) return num(v / 1e6, 2) + 'M km';
    if (unit === 'min') return Math.floor(v / 60) + 'h ' + String(Math.round(v % 60)).padStart(2, '0') + 'm';
    if (unit === 'yr') return v >= 1 ? num(v, v < 10 ? 1 : 0) + ' yrs' : v * 365 >= 14 ? num(v * 52, 0) + ' weeks' : num(v * 365, 0) + ' days';
    return num(v, v < 1 ? 2 : v < 10 ? 1 : 0) + ' ' + unit;
  }
  function roundSig(v, s) { const p = Math.pow(10, Math.floor(Math.log10(v)) - s + 1); return Math.round(v / p) * p; }
  // storage keeps the old 'climb.' prefix so streaks and history carry over from Climb
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem('climb.' + k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('climb.' + k, JSON.stringify(v)); } catch (e) {} },
  };

  // ---------- scoring: the best option on screen is always worth 100 ----------
  function dist(round, v) { return round.kind === 'year' ? Math.abs(v - round.target) : Math.abs(Math.log(v / round.target)); }
  function bestDist(round) { return Math.min(...round.opts.map(o => dist(round, o.v))); }
  function score(round, v) {
    const extra = dist(round, v) - bestDist(round);          // how much worse than the best choice
    if (extra < 1e-9) return { pts: 100, tier: 'bull' };
    if (round.kind === 'year') {
      return { pts: Math.round(100 * Math.exp(-extra / 6)),
        tier: extra <= 3 ? 'close' : extra <= 10 ? 'warm' : extra <= 25 ? 'cold' : 'miss' };
    }
    return { pts: Math.round(100 * Math.exp(-3 * extra)),
      tier: extra < 0.1 ? 'close' : extra < 0.3 ? 'warm' : extra < 0.7 ? 'cold' : 'miss' };
  }

  // ---------- question building ----------
  // recently used answers are avoided so practice rarely repeats
  let recent = new Set(store.get('recent') || []);
  function remember(keys) {
    const arr = (store.get('recent') || []).filter(k => !keys.includes(k)).concat(keys);
    const kept = arr.slice(-500);
    store.set('recent', kept); recent = new Set(kept);
  }

  function numberRound(kind, r, avoid) {
    const c = CATS[kind];
    const pool = shuffle(c.items, r);
    const fresh = pool.filter(it => !avoid.has(kind + ':' + it[0]));
    const anchor = (fresh.length ? fresh : pool)[0];
    const opts = [anchor];
    for (const gap of [0.14, 0.08]) {                        // keep options clearly different
      for (const it of pool) {
        if (opts.length === 4) break;
        if (opts.every(o => Math.abs(Math.log(o[1] / it[1])) > gap)) opts.push(it);
      }
      if (opts.length === 4) break;
    }
    // the target sits close to the anchor: the anchor is always the clear best and genuinely near
    const minGap = Math.min(...opts.slice(1).map(o => Math.abs(Math.log(o[1] / anchor[1]))));
    const span = Math.min(minGap * 0.4, MAX_OFF);
    const raw = anchor[1] * Math.exp((r() * 2 - 1) * span);
    let target = raw;
    for (const s of [2, 3, 4]) {
      const t = c.unit === '#' ? Math.round(raw) : roundSig(raw, s);
      const d = opts.map(o => Math.abs(Math.log(o[1] / t)));
      if (d[0] <= MAX_OFF + 0.01 && d[0] < Math.min(...d.slice(1)) * 0.75) { target = t; break; }
      if (c.unit === '#') { target = anchor[1]; break; }
    }
    return { kind, key: kind + ':' + anchor[0], prompt: c.q, suffix: c.suffix, unit: c.unit, target,
      opts: shuffle(opts, r).map(([name, v]) => ({ name, v })) };
  }

  function yearRound(r, avoid) {
    const pool = shuffle(YEARS, r);
    const fresh = pool.filter(e => !avoid.has('y:' + e[0]));
    const [ev, y] = (fresh.length ? fresh : pool)[0];
    // distinct distances so exactly one option is closest; if the exact year isn't shown,
    // one option is always within 3 years
    const near = shuffle([1, 2, 3], r)[0];
    const far = shuffle([4, 5, 7, 10, 15, 25, 40].filter(s => s !== near), r).slice(0, 3);
    const sign = s => { let o = r() < 0.5 ? -s : s; if (y + o > THIS_YEAR) o = -s; return o; };
    const list = r() < 0.75 ? [0, sign(near), sign(far[0]), sign(far[1])] : [sign(near), ...far.map(sign)];
    return { kind: 'year', key: 'y:' + ev, prompt: ev + '?', target: y,
      opts: shuffle(list, r).map(o => ({ name: String(y + o), v: y + o })) };
  }

  function buildGame(seedStr, avoidRecent) {
    const r = rng(hash(seedStr));
    const avoid = avoidRecent ? new Set(recent) : new Set();
    const cats = shuffle(Object.keys(CATS), r);
    const plan = [cats[0], cats[1], 'year', cats[2], cats[3], 'year', cats[4]];
    const rounds = plan.map(kind => {
      const rd = kind === 'year' ? yearRound(r, avoid) : numberRound(kind, r, avoid);
      avoid.add(rd.key);
      return rd;
    });
    return { rounds, golden: Math.floor(r() * ROUNDS) };
  }

  // ---------- state & rendering ----------
  const main = document.getElementById('main'), plane = document.getElementById('plane');
  let game, idx, alt, results, mode, tick, timeLeft;

  function altY(a) {
    const track = document.getElementById('track').clientHeight;
    const pad = parseFloat(getComputedStyle(document.documentElement).fontSize) * 2;  // matches .line inset
    return (pad + (track - pad * 2) * Math.min(1, a / MAX_ALT)) + 'px';
  }
  function setAlt(a) { plane.style.bottom = altY(a); }
  const marks = [[2500, '☁︎'], [8849, '▲']].map(([a, ch]) => {
    const m = document.createElement('div'); m.className = 'mark'; m.textContent = ch; m.dataset.a = a;
    document.getElementById('track').insertBefore(m, plane); return m;
  });
  function placeMarks() { marks.forEach(m => m.style.bottom = altY(+m.dataset.a)); }
  placeMarks();

  const altTxt = a => a.toLocaleString('en-US') + ' m';
  function header(extra) {
    return '<div class="row"><span>' + (mode === 'daily' ? 'Daily ' : 'Practice ') + (idx + 1) + '/' + ROUNDS +
      '</span><span class="alt">' + altTxt(alt) + '</span></div>' + (extra || '');
  }

  function home() {
    clearInterval(tick); alt = 0; setAlt(0);
    const done = store.get('day-' + today()), streak = streakNow();
    main.innerHTML = '<div class="center"><div class="title">ASCEND</div>' +
      '<div class="sub">Pick the closest answer.<br>Closer = higher climb.</div>' +
      (done ? '<div class="sub" style="margin-top:.3rem">Today: <span class="alt">' + altTxt(done.alt) + '</span></div>' : '') +
      (streak ? '<div class="gold">🔥 ' + streak + ' day streak</div>' : '') + '</div>' +
      '<button class="big" id="go">' + (done ? 'Practice' : 'Play today') + '</button>';
    document.getElementById('go').onclick = () => start(done ? 'practice' : 'daily');
  }

  function start(m) {
    mode = m;
    game = m === 'daily' ? buildGame('climb-' + today(), false) : buildGame('p-' + Date.now() + Math.random(), true);
    remember(game.rounds.map(rd => rd.key));
    idx = 0; alt = 0; results = []; setAlt(0); ask();
  }

  function ask() {
    const rd = game.rounds[idx];
    const promptHtml = rd.kind === 'year' ? rd.prompt
      : rd.prompt + ' <b>' + fmt(rd.target, rd.unit) + '</b>' + (rd.suffix ? ' ' + rd.suffix : '');
    main.innerHTML = header('<div class="timer"><i id="bar"></i></div>') +
      '<div class="prompt">' + promptHtml + '</div><div class="opts" id="opts"></div>';
    const box = document.getElementById('opts');
    rd.opts.forEach(o => {
      const b = document.createElement('button');
      b.innerHTML = '<span class="n">' + o.name + '</span>';
      b.onclick = () => answer(o);
      box.appendChild(b);
    });
    timeLeft = TIME;
    const bar = document.getElementById('bar');
    clearInterval(tick);
    tick = setInterval(() => {
      timeLeft -= 0.1;
      bar.style.width = Math.max(0, timeLeft / TIME * 100) + '%';
      bar.style.background = timeLeft < 5 ? 'var(--warm)' : 'var(--close)';
      if (timeLeft <= 0) answer(null);
    }, 100);
  }

  function answer(o) {
    clearInterval(tick);
    const rd = game.rounds[idx];
    let res = o ? score(rd, o.v) : { pts: 0, tier: 'time' };
    const golden = idx === game.golden;
    if (golden) res = { pts: res.pts * 2, tier: res.tier };
    results.push(res.tier);
    alt += res.pts * M_PER_PT;
    setAlt(alt);
    const bd = bestDist(rd);
    const [tName, tCol] = TIERS[res.tier];
    main.innerHTML = header() +
      '<div style="text-align:center;margin:.15rem 0 .2rem"><span class="tier" style="color:' + tCol + '">' + tName + '</span> ' +
      '<span class="pts">+' + (res.pts * M_PER_PT).toLocaleString('en-US') + ' m</span>' +
      (golden ? '<div class="gold">★ Golden round ×2</div>' : '') +
      (rd.kind === 'year' ? '<div class="fact">' + rd.prompt.replace(/\?$/, '') + ': ' + rd.target + '</div>' : '') +
      '</div><div class="opts" id="opts"></div>';
    const box = document.getElementById('opts');
    rd.opts.forEach(x => {
      const b = document.createElement('button');
      b.className = (dist(rd, x.v) - bd < 1e-9 ? 'best ' : '') + (x === o ? 'picked' : '');
      b.innerHTML = '<span class="n">' + x.name + '</span>' + (rd.kind === 'year' ? '' : '<span class="v">' + fmt(x.v, rd.unit) + '</span>');
      b.style.pointerEvents = 'none';
      box.appendChild(b);
    });
    const next = document.createElement('button');
    next.className = 'big'; next.style.marginTop = '.3rem';
    next.textContent = idx + 1 < ROUNDS ? 'Next' : 'Land';
    next.onclick = () => { idx++; idx < ROUNDS ? ask() : finish(); };
    main.appendChild(next);
  }

  function streakNow() {
    const s = store.get('streak');
    if (!s) return 0;
    const y = new Date(); y.setDate(y.getDate() - 1);
    return s.last === today() || s.last === ymd(y) ? s.n : 0;
  }

  function finish() {
    if (mode === 'daily') {
      store.set('day-' + today(), { alt, results });
      const n = streakNow(), s = store.get('streak');
      if (!s || s.last !== today()) store.set('streak', { last: today(), n: n + 1 });
    }
    const best = Math.max(store.get('best') || 0, alt);
    store.set('best', best);
    const mark = alt >= 8849 ? 'Above Everest!' : alt >= 2500 ? 'Above the clouds' : alt >= 500 ? 'Over the rooftops' : 'Still on the runway';
    main.innerHTML = '<div class="center"><div class="sub">You reached</div><div class="title" style="font-size:1.7rem">' + altTxt(alt) + '</div>' +
      '<div class="gold">' + mark + '</div><div class="dots">' +
      results.map(t => '<span style="background:' + TIERS[t][1] + '"></span>').join('') + '</div>' +
      '<div class="sub">' + (mode === 'daily' ? '🔥 ' + streakNow() + ' day streak · ' : '') + 'best ' + altTxt(best) + '</div></div>' +
      '<button class="big" id="go">Done</button>';
    document.getElementById('go').onclick = home;
  }

  addEventListener('resize', () => { placeMarks(); setAlt(alt || 0); });
  // exposed only for automated testing on a PC
  window.__game = { buildGame, score, bestDist, CATS, YEARS, fmt };
  home();
})();
</script>
